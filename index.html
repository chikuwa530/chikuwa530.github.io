<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Tetris - HTML/CSS/JS (Touch対応)</title>
  <style>
    :root{
      --bg:#0f1724; --panel:#0b1220; --accent:#10b981; --muted:#94a3b8; --tile:#7c3aed;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Hiragino Kaku Gothic ProN',Meiryo,Arial;color:#e6eef8;background:var(--bg);}
    .wrap{display:flex;gap:16px;align-items:flex-start;justify-content:center;padding:16px;min-height:100vh}

    /* Game area */
    .board-panel{background:linear-gradient(180deg,#071028, #071428);padding:14px;border-radius:12px;box-shadow:0 10px 30px rgba(4,6,15,.6);}
    canvas#game{background:linear-gradient(180deg,#071022 0%, #08162a 100%);display:block;border-radius:6px}

    /* Side info */
    .info{display:flex;flex-direction:column;gap:12px;width:180px}
    .card{background:var(--panel);padding:10px;border-radius:10px;min-height:60px;color:var(--muted)}
    .card h3{margin:0 0 6px 0;font-size:14px;color:#f8fafc}
    .big{font-size:22px;color:var(--accent);font-weight:700}

    /* Controls (touch) */
    .controls{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;padding:10px}
    .btn{width:64px;height:64px;border-radius:12px;background:linear-gradient(180deg,#0b1220,#071021);display:flex;align-items:center;justify-content:center;color:#e6eef8;font-weight:700;box-shadow:0 6px 12px rgba(2,6,12,.6);user-select:none;touch-action:none}
    .btn:active{transform:translateY(2px)}
    .btn.small{width:40px;height:40px;font-size:14px}

    /* Mobile layout tweaks */
    @media (max-width:700px){
      .wrap{flex-direction:column;align-items:center;padding:12px}
      .info{width:100%;flex-direction:row}
      .card{flex:1}
      .controls{grid-template-columns:repeat(4,56px)}
      .btn{width:56px;height:56px}
    }

    /* Helpful text */
    .muted{color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="board-panel">
      <canvas id="game" width="240" height="480" aria-label="Tetris game"></canvas>
      <div class="controls" id="controls">
        <div class="btn" id="left">◀</div>
        <div class="btn" id="rotate">⟳</div>
        <div class="btn" id="right">▶</div>
        <div class="btn" id="down">▼</div>
        <div class="btn" id="drop">⤓</div>
        <div class="btn" id="pause">II</div>
      </div>
    </div>

    <div class="info">
      <div class="card">
        <h3>Score</h3>
        <div id="score" class="big">0</div>
        <div class="muted">Level: <span id="level">1</span></div>
      </div>
      <div class="card">
        <h3>Next</h3>
        <canvas id="next" width="120" height="120" style="background:transparent;border-radius:8px"></canvas>
      </div>
    </div>
  </div>

  <script>
  /* Simple but playable Tetris implementation
     - Single-file HTML/JS
     - Touch controls and button controls
     - Works on desktop keyboard too
  */

  (()=>{
    const COLS=10, ROWS=20, BLOCK=24; // cell pixel size
    const cvs=document.getElementById('game');
    const ctx=cvs.getContext('2d');
    // scale canvas for high-dpi
    function fitCanvas(){
      const ratio = window.devicePixelRatio || 1;
      cvs.width = COLS*BLOCK*ratio;
      cvs.height = ROWS*BLOCK*ratio;
      cvs.style.width = (COLS*BLOCK)+'px';
      cvs.style.height = (ROWS*BLOCK)+'px';
      ctx.setTransform(ratio,0,0,ratio,0,0);
    }
    fitCanvas(); window.addEventListener('resize',fitCanvas);

    const nextCanvas = document.getElementById('next');
    const nctx = nextCanvas.getContext('2d');

    const COLORS = {
      0: 'rgba(0,0,0,0)',
      I: '#06b6d4', J: '#6366f1', L:'#fb923c', O:'#f59e0b', S:'#10b981', T:'#7c3aed', Z:'#ef4444'
    };

    const SHAPES = {
      I: [[1,1,1,1]],
      J: [[1,0,0],[1,1,1]],
      L: [[0,0,1],[1,1,1]],
      O: [[1,1],[1,1]],
      S: [[0,1,1],[1,1,0]],
      T: [[0,1,0],[1,1,1]],
      Z: [[1,1,0],[0,1,1]]
    };

    function rotate(matrix){
      // Clockwise rotation
      const h=matrix.length, w=matrix[0].length;
      const out = Array.from({length:w}, ()=> Array(h).fill(0));
      for(let r=0;r<h;r++) for(let c=0;c<w;c++) out[c][h-1-r]=matrix[r][c];
      return out;
    }

    function deepCopy(a){return a.map(row=>row.slice())}

    class Piece{
      constructor(type){
        this.type=type; this.matrix=deepCopy(SHAPES[type]);
        this.x = Math.floor((COLS - this.matrix[0].length)/2);
        this.y = -this.matrix.length; // start above
      }
      rotate(){ this.matrix = rotate(this.matrix); }
    }

    // Playfield
    const field = Array.from({length:ROWS}, ()=> Array(COLS).fill(0));

    let current = null, next = null;
    let score=0, level=1, lines=0;
    let dropInterval = 800; // ms
    let lastDrop = 0; let running=true;

    function spawn(){
      if(!next) next = new Piece(randomType());
      current = next; next = new Piece(randomType());
      current.x = Math.floor((COLS - current.matrix[0].length)/2);
      current.y = -current.matrix.length;
      if(collides(current, current.x, current.y)){
        // game over -> clear field and reset
        running=false; alert('Game Over\nScore: '+score); reset();
      }
    }

    function randomType(){ const keys=Object.keys(SHAPES); return keys[Math.floor(Math.random()*keys.length)]; }

    function collides(piece, x, y){
      const m = piece.matrix;
      for(let r=0;r<m.length;r++) for(let c=0;c<m[r].length;c++){
        if(!m[r][c]) continue;
        const fx = x+c, fy = y+r;
        if(fx<0 || fx>=COLS || fy>=ROWS) return true;
        if(fy>=0 && field[fy][fx]) return true;
      }
      return false;
    }

    function lockPiece(){
      const m=current.matrix;
      for(let r=0;r<m.length;r++) for(let c=0;c<m[r].length;c++){
        if(!m[r][c]) continue;
        const fx=current.x+c, fy=current.y+r;
        if(fy>=0) field[fy][fx]=current.type;
      }
      clearLines();
      spawn();
    }

    function clearLines(){
      let cleared=0;
      for(let r=ROWS-1;r>=0;r--){
        if(field[r].every(v=>v)){ field.splice(r,1); field.unshift(Array(COLS).fill(0)); cleared++; r++; }
      }
      if(cleared>0){
        lines+=cleared; score += [0,40,100,300,1200][cleared]*level; level = Math.floor(lines/10)+1; dropInterval = Math.max(100, 800 - (level-1)*50);
        document.getElementById('score').textContent = score;
        document.getElementById('level').textContent = level;
      }
    }

    function hardDrop(){
      while(!collides(current,current.x,current.y+1)) current.y++;
      lockPiece();
    }

    function move(dx){
      if(!collides(current,current.x+dx,current.y)) current.x+=dx;
    }

    function softDrop(){
      if(!collides(current,current.x,current.y+1)) current.y++;
      else lockPiece();
    }

    function attemptRotate(){
      const backup = current.matrix; current.rotate();
      // simple wall-kick: try shifts
      const kicks=[0,-1,1,-2,2];
      for(const k of kicks){ if(!collides(current,current.x+k,current.y)){ current.x+=k; return; } }
      current.matrix = backup; // revert
    }

    // Drawing
    function drawCell(x,y,fill){
      const px = x*BLOCK, py=y*BLOCK; ctx.fillStyle = fill; ctx.fillRect(px+1,py+1,BLOCK-2,BLOCK-2);
      // subtle bevel
      ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.strokeRect(px+0.5,py+0.5,BLOCK-1,BLOCK-1);
    }

    function render(){
      // background
      ctx.clearRect(0,0,COLS*BLOCK,ROWS*BLOCK);
      // draw field
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const v = field[r][c]; drawCell(c,r, v ? COLORS[v] : 'rgba(6,10,20,0.6)');
      }
      // draw current piece
      if(current){
        const m=current.matrix;
        for(let r=0;r<m.length;r++) for(let c=0;c<m[r].length;c++){
          if(!m[r][c]) continue; const fx=current.x+c, fy=current.y+r; if(fy>=0) drawCell(fx,fy,COLORS[current.type]);
        }
      }
    }

    function renderNext(){
      nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
      nctx.save();
      const scale = 16; // pixels per cell in preview
      nctx.translate(10,10);
      if(next){
        const m = next.matrix;
        for(let r=0;r<m.length;r++) for(let c=0;c<m[r].length;c++){
          if(!m[r][c]) continue;
          const x = c*scale, y = r*scale; nctx.fillStyle = COLORS[next.type]; nctx.fillRect(x+1,y+1,scale-2,scale-2);
        }
      }
      nctx.restore();
    }

    // Game loop
    let lastTime=0;
    function update(time=0){
      if(!running) return; const delta = time - lastTime; lastTime = time;
      lastDrop += delta;
      if(lastDrop > dropInterval){ softDrop(); lastDrop = 0; }
      render(); renderNext(); requestAnimationFrame(update);
    }

    function reset(){
      for(let r=0;r<ROWS;r++) field[r].fill(0);
      score=0; level=1; lines=0; dropInterval=800; document.getElementById('score').textContent=0; document.getElementById('level').textContent=1;
      next = new Piece(randomType()); current=null; running=true; spawn(); requestAnimationFrame(update);
    }

    // Controls: Buttons
    document.getElementById('left').addEventListener('pointerdown', ()=>{ move(-1); render(); });
    document.getElementById('right').addEventListener('pointerdown', ()=>{ move(1); render(); });
    document.getElementById('rotate').addEventListener('pointerdown', ()=>{ attemptRotate(); render(); });
    document.getElementById('down').addEventListener('pointerdown', ()=>{ softDrop(); render(); });
    document.getElementById('drop').addEventListener('pointerdown', ()=>{ hardDrop(); render(); });
    document.getElementById('pause').addEventListener('pointerdown', ()=>{ running = !running; if(running) { lastTime=performance.now(); requestAnimationFrame(update);} });

    // Keyboard controls
    window.addEventListener('keydown', e=>{
      if(!running) return; switch(e.code){
        case 'ArrowLeft': move(-1); break; case 'ArrowRight': move(1); break; case 'ArrowUp': attemptRotate(); break; case 'ArrowDown': softDrop(); break; case 'Space': hardDrop(); break; case 'KeyP': running=!running; if(running) requestAnimationFrame(update); break;
      }
      render();
    });

    // Touch gestures on game canvas
    (function touchGestures(){
      let startX=0, startY=0, startTime=0, lastTap=0;
      let touching=false;
      cvs.addEventListener('pointerdown', e=>{ cvs.setPointerCapture(e.pointerId); startX=e.clientX; startY=e.clientY; startTime=Date.now(); touching=true; });
      cvs.addEventListener('pointermove', e=>{ if(!touching) return; });
      cvs.addEventListener('pointerup', e=>{
        touching=false; const dx = e.clientX - startX, dy = e.clientY - startY; const dt = Date.now()-startTime; const dist = Math.hypot(dx,dy);
        // taps and swipes
        if(dist < 10 && dt < 250){
          // tap -> rotate (double tap -> hard drop)
          const now=Date.now(); if(now - lastTap < 300){ hardDrop(); lastTap=0; }
          else { attemptRotate(); lastTap=now; }
        } else {
          // swipe
          if(Math.abs(dx) > Math.abs(dy)){
            if(dx > 20) move(1);
            else if(dx < -20) move(-1);
          } else {
            if(dy > 20) hardDrop(); else if(dy < -20) attemptRotate();
          }
        }
        render();
      });

      // Prevent scrolling when interacting
      cvs.addEventListener('touchmove', e=>{ e.preventDefault(); }, {passive:false});
    })();

    // Start
    spawn(); requestAnimationFrame(update);
  })();
  </script>
</body>
</html>
